```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Connection - Ganit Setu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 30px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .card {
      background: white;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 5px 24px rgba(0,0,0,0.08);
      text-align: center;
      box-sizing: border-box;
    }

    h2 { color: #333; }
    #status {
      overflow-wrap: anywhere;
      line-height: 1.7;
      color: #555;
    }

    .loader {
      margin: 20px auto;
      width: 32px;
      height: 32px;
      border: 4px solid #ddd;
      border-top-color: #833ab4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="card">
    <h2>Ganit Setu</h2>
    <h3>Instagram Connection</h3>
    <div class="loader" id="loader"></div>
    <p id="status">Instagram connection verify ho raha hai...</p>
  </main>

  <script>
    (async function () {
      const status = document.getElementById("status");
      const loader = document.getElementById("loader");
      const params = new URLSearchParams(window.location.search);

      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error_description") || params.get("error");

      const SUPABASE_FUNCTION =
        "https://ucovgluwsiejrhjweuls.supabase.co/functions/v1/instagram-oauth";

      const PROJECT_ANON_KEY =
        "sb_publishable_1XHxsjb_vNK8BYHHGiIYeQ__ouET5_Q";

      function showError(message) {
        loader.style.display = "none";
        status.textContent = message;
      }

      if (error) {
        showError("Meta login cancel ya fail hua: " + error);
        return;
      }

      if (!code || !state) {
        showError(
          "Authorization code nahi mila. Content Day Planning se Instagram connection dobara shuru karein."
        );
        return;
      }

      try {
        const response = await fetch(SUPABASE_FUNCTION, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": PROJECT_ANON_KEY
          },
          body: JSON.stringify({
            action: "exchange",
            code: code,
            state: state
          })
        });

        const result = await response.json();

        if (!response.ok || !result.connected) {
          throw new Error(
            result.error || "Instagram connection complete nahi hua."
          );
        }

        loader.style.display = "none";

        const names = (result.accounts || [])
          .map(account =>
            account.instagram_username
              ? "@" + account.instagram_username
              : account.instagram_user_id
          )
          .join(", ");

        status.textContent =
          "Instagram successfully connected! " + names;

        // Remove the one-time authorization code from the visible URL.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      } catch (err) {
        showError("Connection failed: " + err.message);
      }
    })();
  </script>
</body>
</html>
